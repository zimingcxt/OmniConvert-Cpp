name: Build Cross-Platform Offline Releases (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Offline Bundle (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (6.8.3)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtimageformats'
          aqtversion: '==3.2.1'

      - name: Obtain Static macOS FFmpeg via imageio-ffmpeg
        run: |
          mkdir -p bin
          python3 -m pip install --upgrade pip imageio-ffmpeg
          FF_BIN=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          cp -f "$FF_BIN" bin/ffmpeg
          chmod +x bin/ffmpeg
          ls -lh bin/ffmpeg

      - name: Build, Test & Bundle OmniConvert.app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh "${Qt6_DIR}"
          ditto -c -k --sequesterRsrc --keepParent OmniConvert.app OmniConvert-macOS-Offline.zip

      - name: Upload macOS Offline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-macOS-Offline
          path: OmniConvert-macOS-Offline.zip

  build-windows:
    name: Windows x64 Offline Portable Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (6.8.3 MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'
          aqtversion: '==3.2.1'

      - name: Obtain Static Windows FFmpeg via imageio-ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          python -m pip install --upgrade pip imageio-ffmpeg
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item -Force $ff "bin\ffmpeg.exe"
          Get-Item "bin\ffmpeg.exe"

      - name: Configure, Build, Test & Package Windows Portable ZIP
        shell: pwsh
        run: |
          cmake -S . -B build/win-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
          cmake --build build/win-release --config Release --parallel

          $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
          ctest --test-dir build/win-release -C Release --output-on-failure

          New-Item -ItemType Directory -Force -Path dist/OmniConvert-Win64/bin | Out-Null
          $ExePath = Join-Path "build/win-release" "Release/OmniConvert.exe"
          if (-not (Test-Path $ExePath)) {
            $ExePath = Join-Path "build/win-release" "OmniConvert.exe"
          }
          Copy-Item -Force $ExePath "dist/OmniConvert-Win64/OmniConvert.exe"
          Copy-Item -Force "bin/ffmpeg.exe" "dist/OmniConvert-Win64/bin/ffmpeg.exe"

          & "$env:Qt6_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "dist/OmniConvert-Win64/OmniConvert.exe"
          Compress-Archive -Path "dist/OmniConvert-Win64/*" -DestinationPath OmniConvert-Windows-x64-Offline.zip

      - name: Upload Windows Offline Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-Windows-x64-Offline
          path: OmniConvert-Windows-x64-Offline.zip
